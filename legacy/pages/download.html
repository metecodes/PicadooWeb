<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Picadoo İndir — App Store & Google Play</title>
  <meta name="description" content="Picadoo'yu cihazınıza indirin. Android için Google Play, iOS için App Store." />
  <meta name="theme-color" content="#FFF8F4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="icon" href="../assets/picadoo-icon.png" />
  <style>
    .download-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--cream, #FFF8F4);
    }
    .download-page-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
    }
    .download-card {
      width: 100%;
      max-width: 520px;
      text-align: center;
      background: #fff;
      border: 1.5px solid var(--gray-2, #eee);
      border-radius: 28px;
      padding: 48px 32px;
      box-shadow: var(--shadow-md, 0 20px 50px rgba(0,0,0,0.08));
    }
    .download-card img {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      margin-bottom: 24px;
    }
    .download-card h1 {
      font-size: 32px;
      font-weight: 900;
      color: var(--dark, #1a1a1a);
      margin-bottom: 12px;
    }
    .download-card p {
      font-size: 16px;
      color: var(--gray-text, #666);
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .download-spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 107, 53, 0.15);
      border-top-color: var(--orange, #FF6B35);
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: picadoo-spin 0.8s linear infinite;
    }
    @keyframes picadoo-spin { to { transform: rotate(360deg); } }
    .download-status { font-size: 15px; font-weight: 600; color: var(--dark, #1a1a1a); margin-bottom: 8px; }
    .download-pending { margin-bottom: 24px; }
    .download-fallback { display: block; }
    html.picadoo-download-ready .download-pending { display: none; }
    html.picadoo-download-pending .download-pending { display: block; }
    .download-fallback .store-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: stretch;
      margin-bottom: 20px;
    }
    .download-fallback .store-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      border-radius: 16px;
      background: var(--dark, #1a1a1a);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .download-fallback .store-btn:hover { transform: translateY(-2px); opacity: 0.95; }
    .download-fallback .store-btn.is-disabled {
      background: var(--gray-2, #eee);
      color: var(--gray-text, #666);
      pointer-events: none;
    }
    .download-fallback .store-btn-sub { display: block; font-size: 12px; font-weight: 500; opacity: 0.75; }
    .download-home {
      display: inline-block;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--orange, #FF6B35);
      text-decoration: none;
    }
    .download-ios-note {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(124, 92, 191, 0.08);
      color: var(--gray-text, #666);
      font-size: 14px;
      line-height: 1.6;
    }
    html.picadoo-download-ready[data-platform="ios"] .download-ios-note { display: block; }
  </style>
</head>
<body class="download-page">
  <nav class="nav scrolled">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img class="logo-icon" src="../assets/picadoo-icon.png" alt="" />
        <span class="logo-text">Picadoo</span>
      </a>
      <div class="nav-cta">
        <a href="/" class="btn btn-ghost btn-sm">Ana Sayfa</a>
      </div>
    </div>
  </nav>

  <main class="download-page-main" data-picadoo-auto-redirect="true">
    <div class="download-card">
      <img src="../assets/picadoo-icon.png" alt="Picadoo" width="88" height="88" />
      <h1>Picadoo'yu İndir</h1>

      <div class="download-pending">
        <div class="download-spinner" aria-hidden="true"></div>
        <p class="download-status">Mağazaya yönlendiriliyorsunuz…</p>
        <p>Cihazınıza uygun mağaza birkaç saniye içinde açılacak.</p>
      </div>

      <div class="download-fallback">
        <p id="downloadFallbackText">Picadoo'yu aşağıdaki mağazadan indirebilirsiniz.</p>
        <div class="store-buttons">
          <a id="playStoreBtn" class="store-btn" href="https://play.google.com/store/apps/details?id=com.picadoo.app" rel="noopener noreferrer" target="_blank">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.18 23.76c.33.18.7.22 1.05.14l12.27-12.27-2.6-2.6L3.18 23.76zm18.4-11.75L18.1 9.82 15.4 12l2.7 2.18 3.5-2.17c.99-.62.99-1.63-.02-2.17zm-17.3-9.87c-.06.18-.09.38-.09.6v18.52c0 .22.03.42.09.6l10.8-10.8L4.28 2.14zM15.4 12L3.18.24C2.83.16 2.46.2 2.13.38c-1.03.57-1.03 1.58-.04 2.18l12.13 7.7-2.82 1.74z"/></svg>
            <span>Google Play<span class="store-btn-sub">Android</span></span>
          </a>
          <a id="appStoreBtn" class="store-btn" href="https://apps.apple.com/us/app/picadoo-ai-coloring-book/id6792035870" rel="noopener noreferrer" target="_blank">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11"/></svg>
            <span>App Store<span class="store-btn-sub">iOS</span></span>
          </a>
        </div>
        <p class="download-ios-note">Picadoo App Store ve Google Play'de yayında.</p>
        <a class="download-home" href="/">← Ana sayfaya dön</a>
      </div>
    </div>
  </main>

  <script src="../i18n-content.js"></script>
  <script src="../i18n.js"></script>
  <script>
    (function () {
      const store = window.PICADOO_STORE || {};
      const platform = window.picadooDetectPlatform ? window.picadooDetectPlatform() : 'other';
      document.documentElement.dataset.platform = platform;

      const playBtn = document.getElementById('playStoreBtn');
      const appBtn = document.getElementById('appStoreBtn');
      if (playBtn && store.playStore) playBtn.href = store.playStore;

      if (appBtn && store.appStore) {
        appBtn.href = store.appStore;
        appBtn.classList.remove('is-disabled');
        appBtn.removeAttribute('aria-disabled');
        appBtn.setAttribute('rel', 'noopener noreferrer');
        appBtn.setAttribute('target', '_blank');
        const sub = appBtn.querySelector('.store-btn-sub');
        if (sub) sub.textContent = 'iOS';
      }

      if (platform === 'android' && store.playStore) {
        document.getElementById('downloadFallbackText').textContent = 'Google Play\'den Picadoo\'yu indirin.';
      } else if (platform === 'ios' && !store.appStore) {
        document.getElementById('downloadFallbackText').textContent = 'Picadoo iOS sürümü App Store\'da yakında.';
      }
    })();
  </script>
</body>
</html>
